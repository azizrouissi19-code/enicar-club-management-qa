spring.application.name=backend
server.port=9090

# Base de données (XAMPP / MySQL). ANO-15 : identifiants lus dans l'environnement
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/enicar_clubs?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
# ANO-15 : pas de journalisation SQL par défaut (activer avec SHOW_SQL=true en développement)
spring.jpa.show-sql=${SHOW_SQL:false}

# Origines autorisées (CORS), séparées par des virgules
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Messages des erreurs 4xx renvoyés au client
spring.web.error.include-message=always
server.error.include-message=always
